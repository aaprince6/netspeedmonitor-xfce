name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-checks:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate Bash syntax
        run: bash -n src/netspeed-xfce.sh install.sh uninstall.sh

      - name: Run ShellCheck
        run: shellcheck --severity=error src/netspeed-xfce.sh install.sh uninstall.sh
